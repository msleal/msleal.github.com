<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of AI</title>
<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:"SFMono-Regular",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  [data-theme="dark"]{
    --ink:#0b0e17; --ink2:#10131f; --bone:#e9e3d2; --bone-dim:#8a8472;
    --gold:#c8a24a; --gold-soft:#9c7e3a; --ember:#d9583b; --line:rgba(200,162,74,.18);
  }
  [data-theme="light"]{
    --ink:#f2ece0; --ink2:#e9e2d2; --bone:#1c1a14; --bone-dim:#6d6452;
    --gold:#9c7521; --gold-soft:#9c7521; --ember:#b8431f; --line:rgba(28,26,20,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font-family:var(--serif);overflow:hidden;transition:background .5s ease,color .5s ease}
  canvas{display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .masthead{position:fixed;top:26px;left:32px;z-index:5;pointer-events:none}
  .masthead h1{margin:0;font-size:15px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;color:var(--bone)}
  .masthead .rule{width:54px;height:1px;background:var(--gold);margin:9px 0 7px}
  .masthead p{margin:0;font-style:italic;font-size:13px;color:var(--bone-dim);letter-spacing:.02em}

  .controls{position:fixed;top:26px;right:32px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .crow{display:flex;align-items:center;gap:10px}
  .search{display:flex;align-items:center;background:color-mix(in srgb,var(--ink) 84%,transparent);border:1px solid var(--line);border-radius:2px;backdrop-filter:blur(6px)}
  .search input{background:transparent;border:0;outline:0;color:var(--bone);font-family:var(--mono);font-size:12px;padding:9px 12px;width:190px;letter-spacing:.04em}
  .search input::placeholder{color:var(--bone-dim)}
  .theme-btn{cursor:pointer;background:color-mix(in srgb,var(--ink) 84%,transparent);border:1px solid var(--line);border-radius:2px;width:32px;height:32px;display:grid;place-items:center;color:var(--bone);transition:.25s}
  .theme-btn:hover{border-color:var(--gold)}
  .toggle{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);
    background:color-mix(in srgb,var(--ink) 84%,transparent);border:1px solid var(--line);border-radius:2px;padding:8px 12px;cursor:pointer;user-select:none;transition:.2s}
  .toggle:hover{color:var(--bone)}
  .toggle.on{color:var(--ember);border-color:rgba(217,88,59,.5)}

  .legend{position:fixed;left:32px;bottom:26px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--bone-dim);line-height:2}
  .legend .row{display:flex;align-items:center;gap:8px}
  .legend .dot{width:8px;height:8px;border-radius:50%}
  .footer{position:fixed;right:32px;bottom:26px;z-index:5;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--bone-dim);text-transform:uppercase}

  .panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;z-index:8;
    background:linear-gradient(180deg,var(--ink2),var(--ink));border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .42s cubic-bezier(.16,1,.3,1);
    padding:64px 30px 30px;overflow-y:auto}
  .panel.open{transform:translateX(0)}
  .panel .close{position:absolute;top:22px;right:24px;cursor:pointer;color:var(--bone-dim);font-family:var(--mono);font-size:18px;line-height:1}
  .panel .close:hover{color:var(--bone)}
  .panel .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .panel h2{margin:0 0 16px;font-size:27px;line-height:1.12;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);
    border:1px solid var(--line);border-radius:2px;padding:4px 8px}
  .tension{border:1px solid rgba(217,88,59,.45);background:rgba(217,88,59,.07);border-radius:3px;padding:14px 15px;margin-bottom:22px}
  .tension .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);margin-bottom:7px}
  .tension p{margin:0;font-style:italic;font-size:14.5px;line-height:1.5;color:var(--bone)}
  .sec{margin-bottom:20px}
  .sec .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:9px}
  .sec ul{margin:0;padding-left:16px}
  .sec li{font-size:14px;line-height:1.5;margin-bottom:6px;color:var(--bone)}
  .sec a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line)}
  .sec a:hover{border-color:var(--gold)}
  .empty{color:var(--bone-dim);font-style:italic;font-size:13px}
</style>
</head>

  <div class="rule"></div>

  </div>
  <div class="toggle" id="tensionBtn">tensions only</div>
</div>

<div class="legend" id="legend"></div>
<div class="footer">v0.11 (b78a435) · 2026-06-01</div>

<aside class="panel" id="panel">

  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

window.addEventListener('resize', resize); resize();

const STARS = Array.from({length:160}, ()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.5+.15}));

const nodes = GRAPH.nodes.map((n,i)=>({...n,
  x: W/2 + Math.cos(i)*180 + (Math.random()-.5)*60,
  y: H/2 + Math.sin(i)*180 + (Math.random()-.5)*60, vx:0, vy:0}));
const idx = Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
const edges = GRAPH.edges.map(e=>({s:idx[e.source],t:idx[e.target]})).filter(e=>e.s!=null&&e.t!=null);

let scale=1, ox=0, oy=0;
const sx = n => n.x*scale+ox, sy = n => n.y*scale+oy;
function radius(n){ return (5 + n.degree*1.4 + (n.has_tension?2.5:0)); }

nodes.forEach((n,i)=>n.degree = deg[i]||0);

let dragNode=null;
function step(){
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy||.01;
      const f=2600/d2; const d=Math.sqrt(d2);
      a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
    }
  }
  edges.forEach(e=>{
    const a=nodes[e.s], b=nodes[e.t];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||.01;
    const f=(d-120)*0.012;
    a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
  });
  nodes.forEach(n=>{
    n.vx+=(W/2-n.x)*0.0009; n.vy+=(H/2-n.y)*0.0009;
    if(n===dragNode) return;
    n.vx*=.86; n.vy*=.86; n.x+=n.vx; n.y+=n.vy;
  });
}

let hover=null, selected=null, onlyTension=false, query="";

  if(onlyTension && !n.has_tension) return false;
  if(query && !n.title.toLowerCase().includes(query)) return false;
  return true;
}

function draw(){
  step();
  const c=themeColors();
  ctx.clearRect(0,0,W,H);
  STARS.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle=c.star;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  edges.forEach(e=>{
    const a=nodes[e.s], b=nodes[e.t];
    const dim = (query||onlyTension) && !(visible(a)&&visible(b));
    ctx.strokeStyle = dim ? c.edgeDim : c.edge;
    if(selected && (nodes[e.s]===selected||nodes[e.t]===selected)) ctx.strokeStyle=c.edgeSel;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx(a),sy(a));ctx.lineTo(sx(b),sy(b));ctx.stroke();
  });
  nodes.forEach(n=>{
    const r=radius(n)*Math.sqrt(scale), x=sx(n), y=sy(n);
    const vis=visible(n), dim=(query||onlyTension)&&!vis;
    ctx.globalAlpha = dim?.18:1;
    if(n.has_tension){
      const g=ctx.createRadialGradient(x,y,r,x,y,r+10);
      g.addColorStop(0,c.tGlow);g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r+10,0,7);ctx.fill();
      ctx.strokeStyle=c.tRing;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,r+3.5,0,7);ctx.stroke();
    }
    if(n===hover||n===selected){
      ctx.fillStyle=c.hover;ctx.beginPath();ctx.arc(x,y,r+7,0,7);ctx.fill();
    }
    ctx.fillStyle=colorOf(n);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle=c.nodeStroke;ctx.lineWidth=1.4;ctx.stroke();
    if(scale>.78 || n===hover || n===selected){
      ctx.globalAlpha=dim?.25:.92;
      ctx.fillStyle=c.label;ctx.font="13px Georgia, serif";ctx.textAlign="center";
      ctx.fillText(n.title, x, y+r+15);
    }
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(draw);
}
draw();

function nodeAt(mx,my){
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];
    const r=radius(n)*Math.sqrt(scale)+6;
    if((mx-sx(n))**2+(my-sy(n))**2<r*r) return n;}
  return null;
}
let panning=false, px=0,py=0, moved=false;
cv.addEventListener('mousemove',e=>{
  const mx=e.clientX,my=e.clientY;
  if(dragNode){dragNode.x=(mx-ox)/scale;dragNode.y=(my-oy)/scale;moved=true;return;}
  if(panning){ox+=mx-px;oy+=my-py;px=mx;py=my;moved=true;return;}
  hover=nodeAt(mx,my); cv.style.cursor=hover?'pointer':'grab';
});
cv.addEventListener('mousedown',e=>{
  const n=nodeAt(e.clientX,e.clientY);moved=false;
  if(n){dragNode=n;} else {panning=true;px=e.clientX;py=e.clientY;cv.classList.add('dragging');}
});
window.addEventListener('mouseup',()=>{
  if(dragNode&&!moved) openPanel(dragNode);
  else if(panning&&!moved){closePanel();}
  dragNode=null;panning=false;cv.classList.remove('dragging');
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.89, mx=e.clientX,my=e.clientY;
  ox=mx-(mx-ox)*f; oy=my-(my-oy)*f; scale*=f; scale=Math.max(.35,Math.min(3.2,scale));
},{passive:false});

const $=id=>document.getElementById(id);
const NODE_API="https://atlas-nodes.msleal.workers.dev";
const detailCache={};
function listSec(el,label,arr){
  if(!arr||!arr.length){el.innerHTML=`<div class="lbl">${label}</div><div class="empty">—</div>`;return;}
  el.innerHTML=`<div class="lbl">${label}</div><ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`;
}
function renderDetail(n,d){
  $('p-kicker').textContent=d.type||n.type;
  $('p-title').textContent=d.title||n.title;
  $('p-chips').innerHTML=[d.region,d.altitude,d.status].filter(Boolean).map(c=>`<span class="chip">${c}</span>`).join("");
  $('p-tension').innerHTML=(d.tension||"").trim()
    ? `<div class="tension"><div class="lbl">what looks settled but isn't</div><p>${d.tension}</p></div>` : "";
  listSec($('p-premises'),"accepted premises",d.premises);
  listSec($('p-constraints'),"constraints",d.constraints);
  const f=$('p-sources');
  if(d.sources&&d.sources.length)
    f.innerHTML=`<div class="lbl">sources</div><ul>${d.sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>`).join("")}</ul>`;
  else f.innerHTML=`<div class="lbl">sources</div><div class="empty">—</div>`;
}
function showLoading(n){
  $('p-kicker').textContent=n.type;
  $('p-title').textContent=n.title;
  $('p-chips').innerHTML="";
  $('p-tension').innerHTML="";
  $('p-premises').innerHTML=`<div class="empty">loading…</div>`;
  $('p-constraints').innerHTML="";
  $('p-sources').innerHTML="";
}
async function openPanel(n){
  selected=n;
  $('panel').classList.add('open');
  if(detailCache[n.id]){ renderDetail(n,detailCache[n.id]); return; }
  showLoading(n);
  try{
    const res=await fetch(`${NODE_API}?id=${encodeURIComponent(n.id)}`);
    const d=res.ok ? await res.json() : {};
    detailCache[n.id]=d;
    if(selected===n) renderDetail(n,d);
  }catch(e){
    if(selected===n){ $('p-premises').innerHTML=`<div class="empty">could not load detail</div>`; }
  }
}
function closePanel(){selected=null;$('panel').classList.remove('open');}
$('close').onclick=closePanel;

$('q').addEventListener('input',e=>query=e.target.value.trim().toLowerCase());
$('tensionBtn').addEventListener('click',e=>{onlyTension=!onlyTension;e.target.classList.toggle('on',onlyTension);});

$('legend').innerHTML = Object.entries(TYPE_COLOR).map(([k,v])=>
  `<div class="row"><span class="dot" style="background:${v}"></span>${k}</div>`).join("")
  + `<div class="row" style="margin-top:12px;align-items:center">`
  + `<span class="dot" style="background:transparent;border:1.5px solid var(--bone);box-shadow:none;margin-top:3px;flex:0 0 auto"></span>`
  + `<span style="color:var(--bone-dim)">Note: a ring marks an open tension, where a premise looks settled but isn't.</span></div>`;

// deep-link: atlas.html#agent-memory opens the node directly
window.openPanelById = id => { if(idx[id]!=null) openPanel(nodes[idx[id]]); };
function fromHash(){ const h=decodeURIComponent(location.hash.replace('#','')); if(h) window.openPanelById(h); }
window.addEventListener('hashchange',fromHash);
setTimeout(fromHash,300);

// theme: light by default, remembers choice, shared with the home (same origin)
const docEl=document.documentElement, moon=document.getElementById('ic-moon'), sun=document.getElementById('ic-sun');
function applyTheme(t){
  docEl.setAttribute('data-theme',t);
  moon.style.display = t==='dark' ? 'block':'none';
  sun.style.display  = t==='dark' ? 'none':'block';
}
let theme='light';
try{ theme = localStorage.getItem('ml-theme') || 'light'; }catch(e){}
applyTheme(theme);
document.getElementById('theme').onclick=()=>{
  theme = docEl.getAttribute('data-theme')==='dark' ? 'light':'dark';
  applyTheme(theme);
  try{ localStorage.setItem('ml-theme',theme); }catch(e){}
};
</script>
</body>
